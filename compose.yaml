services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bilhete
      MYSQL_USER: bilhete
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env da raiz}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env da raiz}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - bilhete-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  bilhete-data:

